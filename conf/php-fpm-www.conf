[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
;listen.allowed_clients = any

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Runtime storage is mounted in ../data and accessed from PHP paths
php_admin_value[open_basedir] = /home/zxpress/web/zxpress.ru/public_html:/home/zxpress/web/zxpress.ru/data:/home/zxpress/tmp
php_admin_value[upload_tmp_dir] = /home/zxpress/tmp
php_admin_value[session.save_path] = /home/zxpress/tmp
php_flag[display_errors] = off

request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm-slow.log
request_terminate_timeout = 30s

; status/ping disabled — not exposed externally
;pm.status_path = /fpm-status
;ping.path = /fpm-ping
