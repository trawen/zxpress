# Rate limiting zones — defined at http level via include
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=php:5m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# HSTS only when the edge proxy reports HTTPS (e.g. Traefik + TLS termination).
map $http_x_forwarded_proto $zxpress_hsts_value {
    default "";
    https   "max-age=63072000; includeSubDomains";
}

server {
    listen 80;
    server_name zxpress.ru www.zxpress.ru;
    root /home/zxpress/web/zxpress.ru/public_html;
    index ezines.php;
    charset utf-8;
    server_tokens off;

    # Traefik (e.g. 192.168.202.96): use X-Forwarded-For so $remote_addr, access_log,
    # limit_req, and PHP REMOTE_ADDR see the real client, not the proxy hop.
    set_real_ip_from 192.168.202.96;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Connection and body limits
    client_max_body_size 32m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    limit_conn addr 20;

    # Security headers (shared snippet — also included in location blocks that
    # define their own add_header, since nginx does NOT inherit add_header into
    # child locations)
    include /etc/nginx/security-headers.conf;

    # CSP: 'unsafe-inline' required for legacy inline scripts/styles in Smarty templates.
    # 'unsafe-eval' required only for JSSpeccy emulator (WebAssembly).
    # Migration path: 1) add nonces to inline scripts, 2) remove unsafe-inline,
    # 3) restrict unsafe-eval to /jsspeccy/ location only.
    # form-action required: with default-src 'none', browsers block POST (e.g. hyperjump login) unless allowed.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ajax.googleapis.com https://code.jquery.com https://mc.yandex.ru https://yastatic.net https://an.yandex.ru https://vkontakte.ru https://stg.odnoklassniki.ru https://cdn.connect.mail.ru https://platform.twitter.com; style-src 'self' 'unsafe-inline' https://yastatic.net https://stg.odnoklassniki.ru; img-src 'self' data: https://mc.yandex.ru https://counter.yadro.ru https://yastatic.net https://an.yandex.ru http://zxpress.ru; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://an.yandex.ru https://yastatic.net; frame-src 'self' https://www.youtube.com https://www.facebook.com https://an.yandex.ru; worker-src 'self' blob:; child-src 'self' blob:" always;

    # Block sensitive files and paths
    location ~ /\.(?:ht|svn|git|env) { deny all; return 404; }
    location ~ /init\.inc$ { deny all; return 404; }
    location ~ ^/(fpm-status|fpm-ping)$ { deny all; return 404; }
    # E2E deploy contract: plain text only, never fallback to ezines.php
    location = /e2e-deploy-marker.txt {
        limit_req zone=general burst=20 nodelay;
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        access_log off;
    }
    location ^~ /df148749a7a956a4334286aea4e556e8/ { deny all; return 404; }
    # Block access to includes directory
    location ~ /includes/ { deny all; return 404; }
    # Demo resumable uploader (removed from repo) — deny if ever reintroduced
    location ^~ /test/ { deny all; return 404; }

    # Error pages
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/500.html;

    # JSSpeccy emulator — needs unsafe-eval for WebAssembly, own CSP
    location ^~ /jsspeccy/ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob:" always;
        expires max;
        try_files $uri =404;
        access_log off;
    }

    # Runtime storage mounted outside public_html (site is RO; data is separate mount).
    location = /zxpress_dinamic.png { alias /home/zxpress/web/zxpress.ru/data/cache/chronology/zxpress_dinamic.png; }
    location ^~ /articles/ { alias /home/zxpress/web/zxpress.ru/data/content-store/articles/; try_files $uri =404; access_log off; }
    location ^~ /articles_eng/ { alias /home/zxpress/web/zxpress.ru/data/content-store/articles-eng/; try_files $uri =404; access_log off; }
    location ^~ /chapters/ { alias /home/zxpress/web/zxpress.ru/data/content-store/chapters/; try_files $uri =404; access_log off; }
    location ^~ /pictures/ { alias /home/zxpress/web/zxpress.ru/data/uploads/pictures/; try_files $uri =404; access_log off; }
    location ^~ /screens/ { alias /home/zxpress/web/zxpress.ru/data/uploads/screens/; try_files $uri =404; access_log off; }
    location ^~ /illustrations/ { alias /home/zxpress/web/zxpress.ru/data/uploads/illustrations/; try_files $uri =404; access_log off; }
    location ^~ /books_files/ { alias /home/zxpress/web/zxpress.ru/data/uploads/books-files/; try_files $uri =404; access_log off; }
    location ^~ /files/ { alias /home/zxpress/web/zxpress.ru/data/uploads/files/; try_files $uri =404; access_log off; }
    location ^~ /news_files/ { alias /home/zxpress/web/zxpress.ru/data/uploads/news-files/; try_files $uri =404; access_log off; }
    # Retired legacy surfaces: keep explicit Gone response (no PHP fallback).
    location ^~ /archive/ { return 410; }
    location ^~ /cat/ { return 410; }
    # Historical images remain public, now served from a clearer runtime directory.
    location ^~ /chapters_images/ { alias /home/zxpress/web/zxpress.ru/data/image-archive/; try_files $uri =404; access_log off; }
    location ^~ /articles_web/ { return 410; }

    # Static files — served by Nginx directly, no rate limit
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg|zip|rar|7z|mp3|mp4|pdf|wasm)$ {
        include /etc/nginx/security-headers.conf;
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml;
    gzip_min_length 1000;

    # URL rewrites
    rewrite ^/rss/news\.rss?$ /rss.php last;
    rewrite ^/zxnet/([a-z_.0-9]+)/?$ /zxnet.php?e=$1 last;
    rewrite ^/zxnet/([a-z_.0-9]+)/([0-9]+)?$ /zxnet.php?e=$1&id=$2 last;
    rewrite ^/zxnet/?$ /zxnet.php last;
    rewrite ^/menu/([0-9]+)/?$ /menu.php?r=$1 last;
    rewrite ^/menu/([0-9]+)/([0-9]+)?$ /menu.php?r=$1&id=$2 last;
    rewrite ^/news/p([0-9]+)/?$ /news.php?p=$1 last;
    rewrite ^/news/?$ /news.php last;
    rewrite ^/news/([0-9]+)-[^/]*$ /news.php?id=$1 last;

    # PHP-FPM — rate-limited
    location ~ \.php$ {
        limit_req zone=php burst=10 nodelay;
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index ezines.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_hide_header X-Powered-By;
    }

    # Default — general rate limit
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /ezines.php?$query_string;
    }
}
