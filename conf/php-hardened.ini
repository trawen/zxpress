; --- Error handling ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Uploads ---
upload_max_filesize = 32M
post_max_size = 32M
file_uploads = On
upload_tmp_dir = /home/zxpress/tmp

; --- Execution limits ---
max_execution_time = 30
max_input_time = 30
memory_limit = 128M
max_input_vars = 1000

; --- Disable dangerous functions ---
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,highlight_file,phpinfo,pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals

; --- URL file access ---
; allow_url_fopen MUST stay On — search_client.php uses HTTP streams for Manticore
allow_url_fopen = On
allow_url_include = Off

; --- Session hardening ---
session.cookie_httponly = 1
; HTTP-only dev server; set to 1 behind TLS
session.cookie_secure = 0
; Lax matches runtime ini_set in init.inc (login flows, OAuth-style redirects)
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
; Disable PHP's built-in session GC on each request — the container entrypoint
; runs periodic find-based cleanup instead, avoiding random request latency.
session.gc_probability = 0
session.name = ZXSESSID

; --- Hide PHP ---
expose_php = Off

; --- Encoding ---
mbstring.internal_encoding = UTF-8
default_charset = UTF-8

; --- Compression ---
zlib.output_compression = On
