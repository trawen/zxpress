# Shared security headers — included in all location blocks that define their own add_header.
# In nginx, any location with add_header loses ALL inherited server-level headers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS when $zxpress_hsts_value is non-empty (see map in nginx-site.conf).
add_header Strict-Transport-Security $zxpress_hsts_value always;
