opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
; App code is bind-mounted from host ./site — revalidate so edits apply without guessing FPM restarts.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
; Protect shared memory from scripts
opcache.restrict_api = /usr/local/etc
; File-based cache for faster restarts
opcache.file_cache = /home/zxpress/tmp
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1
