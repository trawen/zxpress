# Production-hardened configuration for zxpress.ru
# Usage: docker compose up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  # NOTE: Existing ./db/mysql_data data must be imported into the named volume
  db_data:
  manticore_data:

services:
  nginx:
    # Pinned digest — rollback: restore tag nginx:1.27-alpine (see commit message when bumping)
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: zxpress_nginx
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/security-headers.conf:/etc/nginx/security-headers.conf:ro
      # App tree is read-only; runtime content is served from separate data mount.
      - ./site:/home/zxpress/web/zxpress.ru/public_html:ro
      - ./data:/home/zxpress/web/zxpress.ru/data:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=1m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - frontend
      - backend
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 100
    ulimits:
      nofile:
        soft: 2048
        hard: 4096

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zxpress_php
    env_file: .env
    expose:
      - "9000"
    volumes:
      - ./site:/src-site:ro
      - ./site:/home/zxpress/web/zxpress.ru/public_html:ro
      # Writable runtime storage outside public_html (see site/includes/storage_paths.php)
      - ./data:/home/zxpress/web/zxpress.ru/data:rw
    healthcheck:
      test: ["CMD-SHELL", "php -r \"if(false===@fsockopen('localhost',9000)){exit(1);}\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      manticore:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /home/zxpress/tmp:size=64m,uid=33,gid=33,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/run:size=1m,noexec,nosuid,nodev
      - /var/log:size=8m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

  manticore:
    image: manticoresearch/manticore:17.5.1
    container_name: zxpress_manticore
    env_file: .env
    volumes:
      - manticore_data:/var/lib/manticore
      - ./conf/manticore.conf:/etc/manticoresearch/manticore.conf
    expose:
      - "9306"
      - "9308"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9308/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /var/run/manticore:size=1m,noexec,nosuid,nodev
      - /var/log/manticore:size=16m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, CHOWN]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 100
    ulimits:
      nofile:
        soft: 2048
        hard: 4096

  db:
    image: mysql:8.0
    container_name: zxpress_db
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --slow-query-log=1
      --long-query-time=1
      --skip-name-resolve
      --local-infile=0
      --symbolic-links=0
      --secure-file-priv=/var/lib/mysql-files
      --log-error-verbosity=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/mysqld:size=1m,noexec,nosuid,nodev
      - /var/log:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
